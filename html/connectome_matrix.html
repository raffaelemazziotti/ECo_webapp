<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="../css/connectome_matrix.css">

</head>
<body>
  <header>
    <h1>Connectome Heatmap</h1>
    <p>Select a view and tap a cell to see the connection strength.</p>
    <div class="nav-buttons">
      <button onclick="location.href='connectome.html'">Prev</button>
      <button onclick="location.href='../index.html'">Home</button>
      <button onclick="location.href='hits.html'">Next</button>
    </div>
  </header>

  <main>
    <div class="controls">
      <label for="group-select">View:</label>

        <option value="both">Demonstrator</option>
        <option value="observer">Observer Only</option>

    </div>
    <div id="heatmap-container">
      <div id="tooltip" class="tooltip"></div>
    </div>
