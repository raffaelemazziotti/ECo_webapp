<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ECo – Modality Comparison</title>
  <link rel="stylesheet" href="../css/mod.css" />
  <link rel="icon" href="../assets/favECon.ico" type="image/x-icon" />

  <script src="https://d3js.org/d3.v6.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body class="mod-page">
  <header>
    <h1>Pupillometry – Modality Comparison</h1>
    <p class="description">Multisensory vs Screen vs Vision only</p>
    <div class="nav-buttons">
      <button class="home-button" onclick="location.href='ver.html'">Back</button>
      <button class="home-button" onclick="window.location.href='../index.html'">Home</button>
      <button class="home-button" onclick="location.href='emovideo.html'">Next</button>
    </div>
  </header>

  <main>
    <div class="mod-image-wrapper">
      <img src="../assets/eco_mod.png" alt="Experimental Design" class="mod-image" />
    </div>

    <div class="container">
      <section class="chart-section">
        <h3>Time Series</h3>
        <div class="chart">
          <canvas id="mod-timeseries-chart"></canvas>
        </div>
      </section>

      <section class="chart-section">
        <h3>Peak Values by Condition</h3>
        <div class="chart">
          <canvas id="mod-peaks-chart"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/mod.js"></script>
</body>
</html>
